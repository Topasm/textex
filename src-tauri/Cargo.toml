[package]
name = "textex-tauri"
version = "1.0.14"
description = "Tauri desktop backend for TextEx"
authors = ["Topasm <dhkdwk0215@naver.com>"]
license = "MIT"
repository = "https://github.com/Topasm/textex"
publish = false
edition = "2021"

[lib]
name = "textex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dunce = "1.0.5"
flate2 = "1"
futures-util = "0.3"
notify = "8.2.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spellbook = "0.4.2"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = {
  version = "1",
  features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"]
}
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = true

# Favor a small distributable while keeping filesystem work asynchronous.
# LTO and a single codegen unit increase release build time but reduce the
# shipped native binary size, which is the useful tradeoff for desktop builds.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
