name: Build & Package

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish Release?'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Release as pre-release (beta)? Published immediately but not shown as Latest.'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            tectonic_asset: tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
            tectonic_dir: linux
            binary_name: tectonic
            build_args: --linux
          - os: macos-latest
            platform: mac-universal
            tectonic_asset: tectonic-0.17.0-x86_64-apple-darwin.tar.gz
            tectonic_dir: mac
            binary_name: tectonic
            build_args: --mac --universal
          - os: windows-latest
            platform: win
            tectonic_asset: tectonic-0.17.0-x86_64-pc-windows-msvc.zip
            tectonic_dir: win
            binary_name: tectonic.exe
            build_args: --win

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Tectonic binary
        shell: bash
        run: |
          RELEASE_BASE="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0"

          if [[ "${{ matrix.platform }}" == "mac-universal" ]]; then
            mkdir -p resources/bin/mac resources/bin/mac/arm64
            curl --fail --location --retry 3 -o tectonic-x64.tar.gz "$RELEASE_BASE/tectonic-0.17.0-x86_64-apple-darwin.tar.gz"
            curl --fail --location --retry 3 -o tectonic-arm64.tar.gz "$RELEASE_BASE/tectonic-0.17.0-aarch64-apple-darwin.tar.gz"
            tar xzf tectonic-x64.tar.gz -C resources/bin/mac
            tar xzf tectonic-arm64.tar.gz -C resources/bin/mac/arm64
            rm tectonic-x64.tar.gz tectonic-arm64.tar.gz
            chmod +x resources/bin/mac/tectonic resources/bin/mac/arm64/tectonic
          else
            mkdir -p "resources/bin/${{ matrix.tectonic_dir }}"
            RELEASE_URL="$RELEASE_BASE/${{ matrix.tectonic_asset }}"
            if [[ "${{ matrix.tectonic_asset }}" == *.zip ]]; then
              curl --fail --location --retry 3 -o tectonic.zip "$RELEASE_URL"
              unzip tectonic.zip -d "resources/bin/${{ matrix.tectonic_dir }}"
              rm tectonic.zip
            else
              curl --fail --location --retry 3 -o tectonic.tar.gz "$RELEASE_URL"
              tar xzf tectonic.tar.gz -C "resources/bin/${{ matrix.tectonic_dir }}"
              rm tectonic.tar.gz
            fi
            chmod +x "resources/bin/${{ matrix.tectonic_dir }}/${{ matrix.binary_name }}" || true
          fi

          ls -lh "resources/bin/${{ matrix.tectonic_dir }}/"

      - name: Build and package
        shell: bash
        run: npx electron-vite build && npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip auto-discovery of Developer ID certificates on macOS CI.
          # Without a real certificate, electron-builder ad-hoc signs with '-',
          # which keeps Team IDs consistent across the main binary and frameworks.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ startsWith(matrix.platform, 'mac') && 'false' || '' }}

      - name: Re-sign macOS app (ad-hoc)
        if: startsWith(matrix.platform, 'mac')
        shell: bash
        run: |
          APP_PATH=$(find dist/mac* -name '*.app' -maxdepth 1 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Re-signing $APP_PATH with consistent ad-hoc identity..."
            codesign --deep --force --sign - "$APP_PATH"
            echo "Verifying signature..."
            codesign --verify --deep --strict "$APP_PATH" && echo "Signature OK" || echo "Signature verification warning (expected for ad-hoc)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TextEx-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/*.blockmap
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true || (github.event_name == 'workflow_dispatch' && inputs.prerelease == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts

          find artifacts -type f \( \
            -name "*.AppImage" -o -name "*.blockmap" -o -name "*.deb" -o \
            -name "*.dmg" -o -name "*.exe" -o -name "*.zip" -o \
            -name "latest*.yml" \
          \) -exec cp {} release-artifacts/ \;

          test -f release-artifacts/latest.yml
          test -f release-artifacts/latest-mac.yml
          test -f release-artifacts/latest-linux.yml

          # Generate checksums
          cd release-artifacts
          sha256sum * > checksums.txt

          echo "Release artifacts:"
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: v${{ steps.version.outputs.version }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            ## Installation

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows | `TextEx-${{ steps.version.outputs.version }}-windows-x64.exe` | NSIS installer |
            | macOS (Intel + Apple Silicon) | `TextEx-${{ steps.version.outputs.version }}-macos-universal.dmg` | Drag to Applications |
            | Linux (.deb) | `TextEx-${{ steps.version.outputs.version }}-linux-amd64.deb` | `sudo dpkg -i TextEx-*.deb` |
            | Linux (.AppImage) | `TextEx-${{ steps.version.outputs.version }}-linux-x86_64.AppImage` | `chmod +x` and run |

            ## Security Notes

            - **Windows:** SmartScreen may show a warning. Click "More info" then "Run anyway".
            - **macOS:** Gatekeeper may block the app. Run `xattr -cr "/Applications/TextEx.app"` in Terminal.
            - **Linux:** Verify SHA256 checksums against `checksums.txt` before installation.

            ## What's Changed
